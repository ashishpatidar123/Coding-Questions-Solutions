name: One-Time Repo Reorganization

# This trigger allows you to run the action manually from the Actions tab
on:
  workflow_dispatch:

jobs:
  reorganize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Reorganization Script
        run: python reorganize.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          # Remove the empty my-solutions directory if it still exists
          git clean -fd
          git diff --quiet && git diff --staged --quiet || (git commit -m "Chore: Reorganize solutions by difficulty and generate stats.json" && git push)
