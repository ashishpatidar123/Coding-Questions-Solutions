name: Notify Resources Website

on:
  push:
    branches:
      - main
    paths:
      - "my-solutions/**"

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Resources sync
        env:
          TOKEN: ${{ secrets.RESOURCES_SYNC_TOKEN }}
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/ashishpatidar123/resources/dispatches \
            -d '{"event_type":"leetcode_sync"}'
