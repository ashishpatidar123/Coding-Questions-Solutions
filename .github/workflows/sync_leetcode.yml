name: Sync Leetcode

on:
  workflow_dispatch: # Allows you to trigger the script manually
  schedule:
    - cron: "0 8 * * 6" # Automatically runs once a week as a fallback

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Sync
        uses: joshcai/leetcode-sync@v1.7
        with:
          github-token: ${{ github.token }}
          leetcode-csrf-token: ${{ secrets.LEETCODE_CSRF_TOKEN }}
          leetcode-session: ${{ secrets.LEETCODE_SESSION }}
          destination-folder: my-solutions # Optional: puts all code in this folder
          verbose: true
