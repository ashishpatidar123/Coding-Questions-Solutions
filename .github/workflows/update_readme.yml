name: Generate Topic-Wise README

on:
  workflow_dispatch: # Allows you to run it manually from the Actions tab
  push:
    branches:
      - main # Change to 'master' if that is your default branch
    paths:
      - 'my-solutions/**' # ONLY triggers when changes happen inside my-solutions

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Ensure difficulty folders exist
        run: |
          mkdir -p my-solutions/Easy
          mkdir -p my-solutions/Medium
          mkdir -p my-solutions/Hard

      - name: Run README Generator
        run: python generate_readme.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "docs: auto-update topic-wise README" && git push)