name: Generate Topic-Wise README

on:
  workflow_dispatch: # Allows you to run it manually
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md' # Prevents an infinite loop when the bot pushes the README

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run README Generator
        run: python generate_readme.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: auto-update topic-wise README" || echo "No changes to commit"
          git push
