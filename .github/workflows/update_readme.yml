name: Generate Topic-Wise README

on:
  workflow_dispatch: 
  push:
    branches:
      - main 
    paths:
      - 'my-solutions/**' 

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Ensures full Git history is fetched for clean pulling

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Sync with Remote (Fixes Conflicts)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull origin main --rebase

      - name: Ensure difficulty folders exist
        run: |
          mkdir -p my-solutions/Easy
          mkdir -p my-solutions/Medium
          mkdir -p my-solutions/Hard

      - name: Run README Generator
        run: python .github/scripts/generate_readme.py

      - name: Commit and Push changes
        run: |
          git add README.md
          git diff --quiet && git diff --staged --quiet || git commit -m "docs: auto-update topic-wise README"
          git push
